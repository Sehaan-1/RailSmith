name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruby-test:
    name: Ruby — minitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: ruby
          bundler-cache: true # runs bundle install against ruby/Gemfile
      - name: Run minitest (capture output)
        run: |
          set +e
          bundle exec rake 2>&1 | tee "$RUNNER_TEMP/ruby-test.log"
          status=${PIPESTATUS[0]}
          exit "$status"
        working-directory: ruby
      - name: Expose failure details as an annotation
        if: failure()
        run: |
          python3 - "$RUNNER_TEMP/ruby-test.log" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          if path.exists():
              text = path.read_text(errors="replace")
              text = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", text)[-10000:]
              text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Ruby minitest output::{text}")
          PY

  ruby-sorbet:
    name: Ruby — sorbet typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: ruby
          bundler-cache: true
      - name: Run Sorbet (capture output)
        run: |
          set +e
          bundle exec srb tc 2>&1 | tee "$RUNNER_TEMP/ruby-sorbet.log"
          status=${PIPESTATUS[0]}
          exit "$status"
        working-directory: ruby
      - name: Expose failure details as an annotation
        if: failure()
        run: |
          python3 - "$RUNNER_TEMP/ruby-sorbet.log" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          if path.exists():
              text = path.read_text(errors="replace")
              text = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", text)[-10000:]
              text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Sorbet output::{text}")
          PY

  ui:
    name: UI — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
