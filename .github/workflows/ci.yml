name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruby-test:
    name: Ruby — minitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: ruby
          bundler-cache: true # runs bundle install against ruby/Gemfile
      - run: bundle exec rake
        working-directory: ruby

  ruby-sorbet:
    name: Ruby — sorbet typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: ruby
          bundler-cache: true
      - run: bundle exec srb tc
        working-directory: ruby

  ui:
    name: UI — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
